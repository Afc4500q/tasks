<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة الواجبات والمهام</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --done-color: #22c55e;
            --pending-color: #f59e0b;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding: 16px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .header h1 {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--primary);
            color: #0f172a;
            font-weight: 700;
            border-color: var(--primary);
        }

        .tasks-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 768px) {
            .tasks-grid {
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            }
        }

        .task-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .subject-badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
        }

        .status-done {
            background: rgba(34, 197, 94, 0.15);
            color: var(--done-color);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.15);
            color: var(--pending-color);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .task-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
        }

        .task-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .task-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .task-note {
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #cbd5e1;
            border-right: 3px solid var(--primary);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📚 لوحة متابعة المهام الجامعية</h1>
        <p style="font-size: 0.9rem; color: var(--text-muted);">متابعة الواجبات، الكوزات، والتقارير</p>
    </div>

    <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all', this)">الكل</button>
        <button class="filter-btn" onclick="setFilter('قيد الانجاز', this)">قيد الإنجاز</button>
        <button class="filter-btn" onclick="setFilter('منجز', this)">المنجز</button>
    </div>

    <div class="tasks-grid" id="tasksContainer">
        <div class="empty-state">جاري تحميل المهام...</div>
    </div>

    <script>
        let tasks = [];

        async function fetchTasks() {
            try {
                // جلب ملف tasks.json مع منع التخزين المؤقت (cache) لضمان أحدث نسخة
                const res = await fetch('tasks.json?t=' + new Date().getTime());
                if (!res.ok) throw new Error();
                tasks = await res.json();
                renderTasks('all');
            } catch (err) {
                document.getElementById('tasksContainer').innerHTML = 
                    '<div class="empty-state">تعذر تحميل ملف tasks.json، تأكد من وجوده في نفس المجلد.</div>';
            }
        }

        function renderTasks(filter) {
            const container = document.getElementById('tasksContainer');
            container.innerHTML = '';

            const filtered = tasks.filter(t => filter === 'all' || t.status === filter);

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">لا توجد مهام مطابقة.</div>';
                return;
            }

            filtered.forEach(task => {
                const isDone = task.status === 'منجز';
                const card = document.createElement('div');
                card.className = 'task-card';
                card.innerHTML = `
                    <div class="card-top">
                        <span class="subject-badge">${task.subject}</span>
                        <span class="status-badge ${isDone ? 'status-done' : 'status-pending'}">
                            ${task.status}
                        </span>
                    </div>
                    <div class="task-title">${task.type}: ${task.title || task.subject}</div>
                    <div class="task-meta">
                        <span>📅 تاريخ التسليم: <strong>${task.dueDate}</strong></span>
                    </div>
                    ${task.note ? `<div class="task-note">${task.note}</div>` : ''}
                `;
                container.appendChild(card);
            });
        }

        function setFilter(type, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTasks(type);
        }

        fetchTasks();
    </script>
</body>
</html>
